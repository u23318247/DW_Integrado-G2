<article class="card" [class.featured]="destacado()">
  @if (destacado()) {
    <span class="featured-label">Destacado</span>
  }
  <span class="badge">{{ producto().categoria }}</span>
  <h2>{{ producto().nombre }}</h2>
  <p>{{ producto().descripcion }}</p>
  <strong class="price">{{ producto().precio | currency: 'PEN' : 'symbol' : '1.2-2' }}</strong>

  <div class="actions">
    <button type="button" (click)="solicitarDetalle()">Ver detalle</button>
    <button type="button" class="ghost" (click)="marcarFavorito()">Favorito</button>
    <button type="button" class="ghost" (click)="agregarAComparacion()">Comparar</button>
  </div>
</article>
