<section class="page-heading">
  <div>
    <p class="eyebrow">CATÁLOGO</p>
    <h1>Productos</h1>
  </div>
  <div class="stats">
    <span>Favoritos: <strong>{{ favoritos() }}</strong></span>
    <span>Comparados: <strong>{{ comparados().length }}</strong></span>
  </div>
</section>

<div class="grid">
  @for (producto of productos(); track producto.id) {
    <app-producto-card
      [producto]="producto"
      [destacado]="esDestacado(producto.precio)"
      (verDetalle)="irDetalle($event)"
      (favorito)="registrarFavorito($event)"
      (agregarComparacion)="registrarComparacion($event)"
    />
  }
</div>
