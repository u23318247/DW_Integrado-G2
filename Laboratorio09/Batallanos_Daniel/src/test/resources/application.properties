# ===================================================================
# Configuracion de PRUEBAS (mvn clean test)
# Usa H2 en memoria para que las pruebas no dependan de un MySQL activo.
# ===================================================================

spring.application.name=tienda-seguridad-test

spring.datasource.url=jdbc:h2:mem:tienda_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Esquema creado y destruido en cada ejecucion de pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ------------------------------------------------------------------
# Clave JWT SOLO PARA PRUEBAS (48 bytes en Base64, nunca usar en produccion).
# Evita depender de la variable de entorno JWT_SECRET_BASE64 al correr los tests.
# ------------------------------------------------------------------
app.jwt.issuer=tienda-api
app.jwt.ttl-minutes=30
app.jwt.secret-base64=PVN9kVcIOY+43rP4g4n4YBWvQWzZPFDV9w8lACu6r6bQFkk8N1kFxBZALJAowxSn

# Silencia el ruido de los filtros de seguridad durante los tests
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=ERROR
logging.level.org.springframework=WARN