spring.application.name=tienda

# --- Conexion a MySQL ---
# createDatabaseIfNotExist crea tienda_db automaticamente si aun no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Semana 10: la contrasena ya NO se versiona; se lee de la variable de entorno DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT (semana 9) ---
app.jwt.issuer=tienda-api
app.jwt.ttl-minutes=30
# La clave NO se versiona: se lee de la variable de entorno JWT_SECRET_BASE64.
# Si falta, la aplicacion falla al iniciar (comportamiento esperado).
app.jwt.secret-base64=${JWT_SECRET_BASE64}
