spring.application.name=tienda

spring.datasource.url=jdbc:mysql://localhost:3306/tienda_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=https://tienda-api.utp.edu.pe
app.jwt.ttl-minutes=30
