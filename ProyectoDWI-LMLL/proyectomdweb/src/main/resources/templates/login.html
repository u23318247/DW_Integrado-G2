<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMLL - Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Identity Services API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body, .display-font, .form-input-lmll, .btn-lmll {
            font-family: 'Batang', serif;
        }
        body {
            background-color: #fafafa;
        }
        .login-container {
            max-width: 460px;
            margin: 6vh auto;
            background: #fff;
            padding: 35px 40px;
            border: 1px solid #eaeaea;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border-radius: 8px;
        }
        .form-input-lmll {
            border-radius: 4px;
            border: 1px solid #ccc;
            padding: 11px 14px;
        }
        .form-input-lmll:focus {
            box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
            border-color: #d4af37;
        }
        .btn-lmll {
            background-color: #111;
            color: #d4af37;
            border: 1px solid #111;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 12px;
            transition: all 0.3s;
        }
        .btn-lmll:hover {
            background-color: #000;
            color: #fff;
        }
        .btn-google {
            background-color: #fff;
            color: #374151;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 0.92rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-google:hover {
            background-color: #f9fafb;
            border-color: #9ca3af;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }
        .divider span {
            padding: 0 10px;
        }
        .brand-logo {
            height: 55px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-container text-center">
            <a th:href="@{/}" title="Volver a la tienda LMLL">
                <img th:src="@{/img/logo.png}" alt="La Moda te LLama" class="brand-logo">
            </a>
            
            <h1 class="display-font h4 mb-1">Iniciar Sesión</h1>
            <p class="text-muted mb-4" style="font-size: 0.88rem;">Acceso para Clientes y Personal Administrativo</p>

            <div th:if="${param.logout}" class="alert alert-info text-start p-2 mb-3" style="border-radius: 4px; font-size: 0.88rem;">
                <i class="bi bi-info-circle-fill me-2"></i> Sesión finalizada correctamente.
            </div>

            <div th:if="${param.exito == 'registro'}" class="alert alert-success text-start p-2 mb-3" style="border-radius: 4px; font-size: 0.88rem;">
                <i class="bi bi-check-circle-fill me-2"></i> ¡Cuenta creada con éxito! Por favor, inicia sesión.
            </div>

            <div th:if="${param.error}" class="alert alert-danger text-start p-2 mb-3" style="border-radius: 4px; font-size: 0.88rem;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> Correo o contraseña incorrectos.
            </div>

            <!-- Botón Oficial de Google Identity Services API -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleGoogleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <button type="button" class="btn-google mb-3" onclick="iniciarSesionGoogleSimulado()">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
                </svg>
                <span>Continuar con Google</span>
            </button>

            <div class="divider">
                <span>o con tu correo</span>
            </div>

            <!-- Formulario Tradicional -->
            <form th:action="@{/auth/login}" method="POST" class="text-start" id="loginForm">
                
                <div class="mb-3">
                    <label class="form-label fw-bold" style="font-size: 0.88rem;">Correo Electrónico</label>
                    <input type="email" id="usernameInput" name="username" class="form-control form-input-lmll" placeholder="ejemplo@correo.com" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold d-flex justify-content-between" style="font-size: 0.88rem;">
                        Contraseña
                        <a href="#" class="text-muted" style="font-size: 0.8rem; text-decoration: none;">¿Olvidaste tu contraseña?</a>
                    </label>
                    <input type="password" id="passwordInput" name="password" class="form-control form-input-lmll" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-lmll w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                </button>

                <div class="text-center mt-3" style="font-size: 0.92rem;">
                    ¿No tienes una cuenta? <a th:href="@{/auth/registro}" class="text-dark fw-bold" style="text-decoration: underline;">Regístrate aquí</a>
                </div>

                <div class="text-center mt-4 pt-3 border-top">
                    <a th:href="@{/}" class="text-secondary text-decoration-none" style="font-size: 0.85rem;">
                        <i class="bi bi-arrow-left me-1"></i> Volver a la Tienda Virtual
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de integración de Google Identity Services -->
    <script>
        function handleGoogleCredentialResponse(response) {
            console.log("Token ID Google obtenido:", response.credential);
            // Simulación o reenvío al backend para validación OAuth2
            if (response.credential) {
                alert("✓ Autenticado con Google exitosamente. Iniciando sesión en LMLL...");
                window.location.href = "/";
            }
        }

        function iniciarSesionGoogleSimulado() {
            const correo = prompt("Simulación Google OAuth2:\nIngresa tu correo de Google institucional o personal:", "cliente@gmail.com");
            if (correo && correo.includes("@")) {
                const userInput = document.getElementById("usernameInput");
                const passInput = document.getElementById("passwordInput");
                if (userInput && passInput) {
                    userInput.value = correo;
                    passInput.value = "GoogleOAuth2026!";
                    alert("✓ Conexión con Google API exitosa. Redirigiendo a tu cuenta...");
                    window.location.href = "/";
                }
            }
        }
    </script>
</body>
</html>
