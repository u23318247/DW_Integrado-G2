<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMLL - Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body, .display-font, .form-input-lmll, .btn-lmll { font-family: 'Batang', serif; }
        body { background-color: #fafafa; }
        .login-container {
            max-width: 580px;
            margin: 4vh auto;
            background: #fff;
            padding: 35px 40px;
            border: 1px solid #eaeaea;
            box-shadow: 0 12px 35px rgba(0,0,0,0.06);
            border-radius: 8px;
        }
        .form-input-lmll { 
            border-radius: 4px; 
            border: 1px solid #ccc; 
            padding: 10px 14px; 
            font-size: 0.95rem;
        }
        .form-input-lmll:focus { 
            box-shadow: 0 0 0 3px rgba(212,175,55,0.2); 
            border-color: #d4af37; 
        }
        .btn-lmll { 
            background-color: #111; 
            color: #d4af37; 
            border: 1px solid #111;
            border-radius: 4px; 
            text-transform: uppercase; 
            font-weight: bold; 
            letter-spacing: 1px; 
            padding: 12px; 
            transition: all 0.3s ease;
        }
        .btn-lmll:hover { 
            background-color: #000; 
            color: #fff; 
            border-color: #000; 
        }
        .btn-dni {
            background-color: #111;
            color: #d4af37;
            border: 1px solid #111;
            border-radius: 0 4px 4px 0;
            padding: 0 16px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .btn-dni:hover {
            background-color: #000;
            color: #fff;
        }
        .badge-reniec {
            background: rgba(22, 101, 52, 0.1);
            color: #15803d;
            border: 1px solid rgba(22, 101, 52, 0.25);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 20px;
        }
        .domain-btn {
            font-size: 0.72rem;
            border: 1px solid #ddd;
            background: #f8f9fa;
            color: #555;
            padding: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .domain-btn:hover {
            background: #e9ecef;
            color: #000;
            border-color: #bbb;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-container text-center">
            
            <a th:href="@{/}">
                <img th:src="@{/img/logo.png}" alt="La Moda te LLama" style="height: 55px; margin-bottom: 15px;">
            </a>
            <h1 class="display-font h4 mb-2">Crear una cuenta</h1>
            <p class="text-muted small mb-4">Ingresa tu DNI para autocompletar tus datos con el servicio de RENIEC</p>

            <div th:if="${param.error == 'email'}" class="alert alert-danger text-start p-2 mb-4" style="border-radius: 4px; font-size: 0.88rem;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> Este correo electrónico ya se encuentra registrado.
            </div>

            <form th:action="@{/auth/registro}" method="POST" class="text-start" id="registroForm">
                
                <!-- 1. Campo DNI con API RENIEC -->
                <div class="mb-3 p-3 rounded" style="background: #fbfbfb; border: 1px solid #e9ecef;">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="dni" class="form-label fw-bold mb-0" style="font-size: 0.88rem;">
                            <i class="bi bi-person-vcard text-warning me-1"></i> DNI (RENIEC API)
                        </label>
                        <span id="dniBadge" class="badge-reniec d-none">
                            <i class="bi bi-check-circle-fill me-1"></i> Verificado RENIEC
                        </span>
                    </div>
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="dni" 
                            name="dni" 
                            class="form-control form-input-lmll" 
                            placeholder="Ingresa 8 dígitos" 
                            maxlength="8" 
                            pattern="\d{8}" 
                            inputmode="numeric" 
                            autocomplete="off"
                            oninput="onDniInput(this.value)">
                        <button type="button" class="btn btn-dni" id="btnConsultarDni" onclick="consultarDniManual()">
                            <span id="btnDniText"><i class="bi bi-search me-1"></i> Consultar</span>
                            <span id="btnDniSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </div>
                    <div id="dniFeedback" class="small mt-1 text-muted" style="font-size: 0.78rem;">
                        Autocompletado automático de nombres al escribir 8 dígitos.
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <!-- Nombre Completo autocompletado -->
                    <div class="col-12">
                        <label class="form-label fw-bold" style="font-size: 0.88rem;">Nombre Completo</label>
                        <input 
                            type="text" 
                            id="nombre" 
                            name="nombre" 
                            class="form-control form-input-lmll" 
                            placeholder="Tus nombres y apellidos" 
                            required>
                    </div>

                    <!-- Correo Electrónico con atajos -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="font-size: 0.88rem;">Correo Electrónico</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control form-input-lmll" 
                            placeholder="ejemplo@correo.com" 
                            required>
                        <div class="d-flex gap-1 mt-1">
                            <button type="button" class="domain-btn" onclick="completarDominio('@gmail.com')">+ @gmail.com</button>
                            <button type="button" class="domain-btn" onclick="completarDominio('@outlook.com')">+ @outlook.com</button>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="font-size: 0.88rem;">Contraseña</label>
                        <input 
                            type="password" 
                            name="password" 
                            class="form-control form-input-lmll" 
                            placeholder="Mínimo 6 caracteres" 
                            minlength="6" 
                            required>
                    </div>

                    <!-- Teléfono -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="font-size: 0.88rem;">Teléfono (Opcional)</label>
                        <input 
                            type="tel" 
                            name="telefono" 
                            class="form-control form-input-lmll" 
                            placeholder="9 dígitos" 
                            maxlength="9" 
                            pattern="\d{9}">
                    </div>

                    <!-- Dirección -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold" style="font-size: 0.88rem;">Dirección (Opcional)</label>
                        <input 
                            type="text" 
                            name="direccion" 
                            class="form-control form-input-lmll" 
                            placeholder="Ej. Av. Larco 123">
                    </div>
                </div>

                <button type="submit" class="btn btn-lmll w-100 mb-3 mt-1">
                    <i class="bi bi-person-check me-1"></i> Registrarme
                </button>

                <div class="text-center mt-3" style="font-size: 0.92rem;">
                    ¿Ya tienes una cuenta? <a th:href="@{/auth/login}" class="text-dark fw-bold" style="text-decoration: underline;">Inicia sesión aquí</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Integración de API RENIEC -->
    <script>
        let timeoutDni = null;

        function onDniInput(valor) {
            const limpio = (valor || '').replace(/\D/g, '').slice(0, 8);
            const input = document.getElementById('dni');
            if (input && input.value !== limpio) input.value = limpio;

            clearTimeout(timeoutDni);
            if (limpio.length === 8) {
                timeoutDni = setTimeout(() => ejecutarConsultaDni(limpio), 400);
            }
        }

        function consultarDniManual() {
            const input = document.getElementById('dni');
            const limpio = (input ? input.value : '').replace(/\D/g, '');
            if (limpio.length === 8) {
                ejecutarConsultaDni(limpio);
            } else {
                mostrarFeedback('Ingrese exactamente 8 dígitos para consultar el DNI.', 'text-danger');
            }
        }

        async function ejecutarConsultaDni(dni) {
            const spinner = document.getElementById('btnDniSpinner');
            const btnText = document.getElementById('btnDniText');
            const badge = document.getElementById('dniBadge');
            const inputNombre = document.getElementById('nombre');

            try {
                if (spinner) spinner.classList.remove('d-none');
                if (btnText) btnText.classList.add('d-none');
                mostrarFeedback('Consultando servicio RENIEC...', 'text-muted');

                const resp = await fetch(`/api/consulta/dni/${dni}`);
                const data = await resp.json();

                if (resp.ok && data && data.encontrado) {
                    const nombreEncontrado = data.nombre || `${data.nombres || ''} ${data.apellidos || ''}`.trim();
                    if (inputNombre) {
                        inputNombre.value = nombreEncontrado;
                        inputNombre.style.backgroundColor = '#f0fdf4';
                        setTimeout(() => inputNombre.style.backgroundColor = '', 1500);
                    }
                    if (badge) badge.classList.remove('d-none');
                    mostrarFeedback(`✓ Encontrado: ${nombreEncontrado}`, 'text-success');
                } else {
                    if (badge) badge.classList.add('d-none');
                    mostrarFeedback(data.mensaje || 'DNI no encontrado. Ingrese su nombre manualmente.', 'text-warning');
                }
            } catch (err) {
                console.warn('Error al consultar DNI:', err);
                mostrarFeedback('Servicio externo no disponible. Ingrese su nombre manualmente.', 'text-warning');
            } finally {
                if (spinner) spinner.classList.add('d-none');
                if (btnText) btnText.classList.remove('d-none');
            }
        }

        function mostrarFeedback(mensaje, claseColor) {
            const fb = document.getElementById('dniFeedback');
            if (!fb) return;
            fb.textContent = mensaje;
            fb.className = `small mt-1 ${claseColor}`;
        }

        function completarDominio(dom) {
            const input = document.getElementById('email');
            if (!input) return;
            let val = input.value.trim();
            if (val.includes('@')) {
                val = val.substring(0, val.indexOf('@'));
            }
            if (val.length > 0) {
                input.value = val + dom;
            } else {
                input.value = 'usuario' + dom;
            }
            input.focus();
        }
    </script>
</body>
</html>
