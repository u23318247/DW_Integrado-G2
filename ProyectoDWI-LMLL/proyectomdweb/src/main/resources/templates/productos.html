<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo Oficial — La Moda te LLama (LMLL)</title>
    <meta name="description" content="Colección exclusiva de moda urbana y alta sastrería peruana."/>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"/>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

    <!-- Estilos de Angular SPA y PWA -->
    <link rel="stylesheet" th:href="@{/angular/styles.css}" />
    <link rel="manifest" href="/manifest.json" />
    <base href="/">

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #090c14;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        overflow-x: hidden;
      }
    </style>
  </head>

  <body>
    <!-- Aplicación Angular SPA Limpia y Unificada (Sin duplicidades de barra ni textos redundantes) -->
    <app-root>
      <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="spinner-border text-warning mb-3" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Cargando catálogo...</span>
        </div>
        <h4 class="text-white fw-bold">Cargando Colección Exclusiva...</h4>
        <p class="text-muted small">Conectando con la base de datos de prendas en tiempo real...</p>
      </div>
    </app-root>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Angular Bundle Scripts -->
    <script type="module" th:src="@{/angular/main.js}"></script>
  </body>
</html>
