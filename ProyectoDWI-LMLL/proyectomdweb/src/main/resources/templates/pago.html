<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMLL — La Moda te LLama</title>
    <meta name="description" content="Colecciones de moda peruana. Prendas premium, cortes limpios y estilo auténtico."/>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"/>

    <!-- Bootstrap 5.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"/>

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"/>

    <!-- Estilos propios -->
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>

  <body>
    <!-- =============================
         NAVBAR — Bootstrap responsive
         ============================= -->
    <header class="site-header border-bottom">
      <nav class="navbar navbar-expand-md w-100 px-3 py-2">
        <a class="navbar-brand" th:href="@{/}">
          <img
            th:src="@{/img/logo.png}"
            alt="La Moda te LLama"
            style="height: 63px; width: auto"
          />
        </a>
        <button
          class="navbar-toggler ms-auto me-2"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="site-nav navbar-nav me-auto ms-4 gap-2">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/}">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/productos}">Productos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/carrito}">Carrito</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- ===================
         CONTENIDO PRINCIPAL
         =================== -->
<main class="py-4">
  <div class="container">
    
    <div class="mb-5 text-center checkout-hero">
      <h1 class="display-font checkout-title">
        Finalizar <em style="color: var(--brand);">Compra</em>
      </h1>
      <p class="checkout-subtitle">Completa tus datos para procesar tu pedido de forma segura.</p>
    </div>

    <form id="checkout-form" th:action="@{/pago/procesar-local}" method="POST" class="needs-validation" novalidate>
      <div class="row g-4 align-items-start">
        
        <div class="col-lg-7">
          <div class="card-lmll mb-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h2 class="display-font h4 mb-0 text-gold"><i class="bi bi-geo-alt me-2"></i>Datos del Cliente</h2>
              <span id="dni-badge" class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1" style="font-size: 0.75rem; display: none;">
                <i class="bi bi-check-circle me-1"></i> Verificado
              </span>
            </div>

            <!-- Campo DNI en la parte superior con Autocompletado Automático -->
            <div class="mb-4 p-3 rounded" style="background: rgba(212, 175, 55, 0.05); border: 1px solid rgba(212, 175, 55, 0.25);">
              <label class="form-label-lmll d-flex justify-content-between align-items-center fw-bold" for="clienteDni">
                <span><i class="bi bi-person-vcard text-gold me-1"></i> DNI del Comprador</span>
                <small class="text-muted-1" style="font-size: 0.75rem;">Ingresa 8 dígitos para autocompletar</small>
              </label>
              <div class="input-group">
                <input 
                  type="text" 
                  id="clienteDni" 
                  name="clienteDni" 
                  th:value="${usuario?.dni}"
                  class="form-control form-input-lmll" 
                  placeholder="Ej. 72345678" 
                  maxlength="8" 
                  pattern="[0-9]{8}"
                  inputmode="numeric"
                  autocomplete="off"
                  oninput="verificarDniInput(this.value)"
                  required
                >
                <button type="button" id="btn-buscar-dni" onclick="ejecutarConsultaDni()" class="btn btn-outline-warning d-flex align-items-center gap-1" style="border-color: rgba(212, 175, 55, 0.6); color: #d4af37;">
                  <span id="spinner-dni" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                  <i id="icon-buscar-dni" class="bi bi-search"></i>
                  <span>Consultar DNI</span>
                </button>
              </div>
              <div id="dni-feedback" class="mt-2 text-gold small d-none">
                <i class="bi bi-check-circle-fill me-1"></i> <span id="dni-feedback-text"></span>
              </div>
            </div>

            <div class="row g-4">
              <div class="col-md-6">
                <label class="form-label-lmll">Nombre completo</label>
                <input type="text" id="clienteNombre" name="clienteNombre" th:value="${usuario?.nombre}" class="form-control form-input-lmll" placeholder="Tu nombre y apellido" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-lmll">Teléfono (9 dígitos)</label>
                <input type="tel" id="clienteTelefono" name="clienteTelefono" th:value="${usuario?.telefono}" class="form-control form-input-lmll" maxlength="9" pattern="[0-9]{9}" placeholder="987654321" required>
              </div>
              <div class="col-12">
                <label class="form-label-lmll">Correo Electrónico</label>
                <input type="email" id="clienteEmail" name="clienteEmail" th:value="${usuario?.email}" class="form-control form-input-lmll" placeholder="ejemplo@correo.com" required>
              </div>
              <div class="col-12">
                <label class="form-label-lmll">Dirección de Entrega</label>
                <input type="text" id="clienteDireccion" name="clienteDireccion" th:value="${usuario?.direccion}" class="form-control form-input-lmll" placeholder="Av. / Jr. / Calle, Distrito, Ciudad" required>
              </div>
            </div>
          </div>

          <div class="choice-grid" role="radiogroup" aria-label="Tipo de comprobante">
                  <label class="choice-card">
                    <input type="radio" name="tipoComprobante" value="BOLETA" checked>
                    <span class="choice-card-content">
                      <i class="bi bi-person-vcard"></i>
                      <span class="choice-card-title">Boleta</span>
                      <span class="choice-card-caption">Ideal para compras personales.</span>
                    </span>
                  </label>
                  <label class="choice-card">
                    <input type="radio" name="tipoComprobante" value="FACTURA">
                    <span class="choice-card-content">
                      <i class="bi bi-building"></i>
                      <span class="choice-card-title">Factura</span>
                      <span class="choice-card-caption">Para compras con RUC.</span>
                    </span>
                  </label>
                </div>
        </div>

        <div class="col-lg-5">
          <div class="checkout-resumen-card sticky-summary">
            
            <div class="checkout-resumen-header">
              <h3 class="display-font mb-0 text-white">Resumen de tu bolsa</h3>
            </div>
            
            <div class="checkout-resumen-content">
              <div id="pago-productos-lista" class="mb-4">
                  </div>
              
              <div class="checkout-divider"></div>
              
              <div class="checkout-total-box mt-0 mb-4">
                <span class="checkout-total-label">Total a pagar</span>
                <span class="checkout-total-price display-font">S/ <span id="pago-total">0.00</span></span>
              </div>

              <input type="hidden" id="input-total-hidden" name="total">

              <button type="submit" class="btn-lmll btn-primary-lmll checkout-btn-main w-100 py-3">
                <i class="bi bi-credit-card-2-front-fill me-2"></i> Ir a la pasarela segura
              </button>
            </div>

          </div>
        </div>

      </div>
    </form>
  </div>
</main>

    <!-- =============
         PIE DE PAGINA
         ============= -->
    <footer class="footer">
      <p>&copy; 2026 LMLL. Todos los derechos reservados.</p>
      <p class="socials">
        <a href="#">www.lmll.com.pe</a> &nbsp;|&nbsp;
        <a href="#">@LmLL_</a> &nbsp;|&nbsp;
      </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script propio con control de versión -->
    <script th:src="@{/js/pago.js(v=3)}"></script>

    <!-- Script garantizado inline para Consulta DNI -->
    <script>
      async function ejecutarConsultaDni() {
          const inputDni = document.getElementById("clienteDni");
          if (!inputDni) return;
          const dni = inputDni.value.replace(/\D/g, "");
          if (dni.length !== 8) {
              alert("Por favor ingresa un DNI válido de 8 dígitos.");
              return;
          }
          const spinner = document.getElementById("spinner-dni");
          const icon = document.getElementById("icon-buscar-dni");
          const feedback = document.getElementById("dni-feedback");
          const feedbackText = document.getElementById("dni-feedback-text");
          const badge = document.getElementById("dni-badge");

          if (spinner) spinner.classList.remove("d-none");
          if (icon) icon.classList.add("d-none");

          try {
              const resp = await fetch("/api/consulta/dni/" + dni);
              const data = await resp.json();
              if (data && data.encontrado) {
                  const elNombre = document.getElementById("clienteNombre");
                  const elEmail = document.getElementById("clienteEmail");
                  const elTel = document.getElementById("clienteTelefono");
                  const elDir = document.getElementById("clienteDireccion");

                  if (elNombre) elNombre.value = data.nombre || "";
                  if (elEmail) elEmail.value = data.email || "";
                  if (elTel) elTel.value = data.telefono || "";
                  if (elDir) elDir.value = data.direccion || "";

                  [elNombre, elEmail, elTel, elDir].forEach(el => {
                      if (el) {
                          el.style.transition = "all 0.3s ease";
                          el.style.borderColor = "#28a745";
                          el.style.backgroundColor = "rgba(40, 167, 69, 0.08)";
                          setTimeout(() => {
                              el.style.borderColor = "";
                              el.style.backgroundColor = "";
                          }, 2500);
                      }
                  });

                  if (badge) {
                      badge.style.display = "inline-flex";
                      badge.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> ' + (data.origen || 'Verificado');
                  }
                  if (feedback && feedbackText) {
                      feedbackText.textContent = "✓ Datos de " + data.nombre + " autocompletados con éxito (" + (data.origen || 'RENIEC') + ").";
                      feedback.className = "mt-2 text-success small";
                      feedback.classList.remove("d-none");
                  }
              } else {
                  if (feedback && feedbackText) {
                      feedbackText.textContent = "ℹ " + (data.mensaje || "DNI no encontrado en RENIEC. Por favor ingresa tus datos manualmente.");
                      feedback.className = "mt-2 text-warning small";
                      feedback.classList.remove("d-none");
                  }
                  if (badge) badge.style.display = "none";
                  const elNombre = document.getElementById("clienteNombre");
                  if (elNombre) elNombre.focus();
              }
          } catch (e) {
              console.error("Error al consultar DNI:", e);
              if (feedback && feedbackText) {
                  feedbackText.textContent = "ℹ No se pudo conectar con el servicio de consulta en este momento. Puedes ingresar tus datos manualmente.";
                  feedback.className = "mt-2 text-warning small";
                  feedback.classList.remove("d-none");
              }
          } finally {
              if (spinner) spinner.classList.add("d-none");
              if (icon) icon.classList.remove("d-none");
          }
      }

      let timeoutDniAuto = null;
      function verificarDniInput(val) {
          const dni = (val || "").replace(/\D/g, "").slice(0, 8);
          const inputDni = document.getElementById("clienteDni");
          if (inputDni && inputDni.value !== dni) inputDni.value = dni;
          clearTimeout(timeoutDniAuto);
          if (dni.length === 8) {
              timeoutDniAuto = setTimeout(ejecutarConsultaDni, 450);
          }
      }
    </script>

  </body>
</html>
