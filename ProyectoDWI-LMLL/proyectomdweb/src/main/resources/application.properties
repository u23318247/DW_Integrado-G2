spring.application.name=proyectomdweb

#-- PERFILES POR AMBIENTE --#
# Sin SPRING_PROFILES_ACTIVE se usa "dev" (application-dev.properties).
# En Docker/produccion: SPRING_PROFILES_ACTIVE=prod (application-prod.properties).
# Credenciales, ddl-auto, secreto JWT y origenes CORS se definen en cada perfil.
spring.profiles.default=dev

#-- RUTA / CONTEXT PATH DEL PROYECTO --#
server.port=8080
server.address=0.0.0.0

# Deshabilitar docker compose automatico ya que usamos base de datos local
spring.docker.compose.enabled=false

#-- CONFIGURACION DE BD POSTGRESQL (url/usuario/password en cada perfil) --#
spring.datasource.driver-class-name=org.postgresql.Driver

#-- CONFIGURACION JPA/HIBERNATE (ddl-auto y show-sql en cada perfil) --#
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#-- JWT (jwt.secret en cada perfil) --#
# Duracion del token: 30 minutos
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

#-- CATALOGO INICIAL (Lab 6): 18 productos x 20 variantes = 360 prendas --#
catalogo.inicializar=true

#-- CONFIGURACION DE CORREO ELECTRONICO (SMTP GMAIL / OUTLOOK) --#
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# spring.mail.username / spring.mail.password se definen en cada perfil
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#-- CONFIGURACION DE OBSERVABILIDAD Y SALUD (ACTUATOR) --#
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=MDWeb - La Moda Te Llama
info.app.version=2.0.0-PROD
info.app.developer=Antonela Jaimes
info.app.description=Plataforma E-commerce Fashion con Alta Concurrencia y Microservicios

#-- ASINCRONISMO Y THREAD POOL EXECUTOR --#
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=mdweb-async-
