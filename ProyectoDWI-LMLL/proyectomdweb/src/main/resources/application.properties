spring.application.name=proyectomdweb

#-- RUTA / CONTEXT PATH DEL PROYECTO --#
server.port=8080
server.address=0.0.0.0

# Deshabilitar docker compose automatico ya que usamos base de datos local
spring.docker.compose.enabled=false

#-- CONFIGURACION DE BD POSTGRESQL (Puerto 5432) --#
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/LLAMABD?currentSchema=public}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:antonela}
spring.datasource.driver-class-name=org.postgresql.Driver

#-- CONFIGURACION JPA/HIBERNATE --#
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#-- CATALOGO INICIAL (Lab 6): 18 productos x 20 variantes = 360 prendas --#
catalogo.inicializar=true

#-- CONFIGURACION DE CORREO ELECTRONICO (SMTP GMAIL / OUTLOOK) --#
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:soporte.lamodatellama@gmail.com}
spring.mail.password=${MAIL_PASSWORD:clave_de_aplicacion}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#-- CONFIGURACION DE OBSERVABILIDAD Y SALUD (ACTUATOR) --#
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=MDWeb - La Moda Te Llama
info.app.version=2.0.0-PROD
info.app.developer=Antonela Jaimes
info.app.description=Plataforma E-commerce Fashion con Alta Concurrencia y Microservicios

#-- ASINCRONISMO Y THREAD POOL EXECUTOR --#
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=mdweb-async-
