#==============================================================#
#  PERFIL PROD - activar con SPRING_PROFILES_ACTIVE=prod        #
#  Sin valores por defecto: si falta una variable de entorno,  #
#  la aplicacion no arranca (evita credenciales en el codigo). #
#==============================================================#

#-- BASE DE DATOS (variables de entorno obligatorias) --#
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#-- JPA: en produccion Hibernate solo valida el esquema, nunca lo modifica --#
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#-- JWT: llave Base64 de minimo 256 bits (generar con: openssl rand -base64 32) --#
jwt.secret=${JWT_SECRET}

#-- CORS: origenes permitidos separados por coma (frontend Angular en Docker por defecto) --#
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8082}

#-- PROXY: respeta X-Forwarded-Proto para que request.isSecure() detecte HTTPS detras de nginx --#
server.forward-headers-strategy=native

#-- CORREO (opcional: sin credenciales simplemente no se envian correos) --#
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
