#-- CORS: origenes permitidos (Angular con ng serve y la app Thymeleaf) --#
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080}

