<header class="lmll-header">
  <div class="container d-flex justify-content-between align-items-center py-2">
    <!-- Brand Logo Único (Sin eslogan ni subtítulos que saturen arriba) -->
    <a href="/" class="lmll-brand text-decoration-none d-flex align-items-center gap-2">
      <span class="lmll-brand__badge">LMLL</span>
      <h1 class="h5 mb-0 brand-font text-white letter-spacing-1">LA MODA TE LLAMA</h1>
    </a>

    <!-- Menú de Categorías y Navegación Principal -->
    <nav class="d-none d-lg-flex align-items-center gap-3 main-nav">
      <button type="button" class="nav-link-btn" (click)="onSelectGenero('Todos')">Colección</button>
      <button type="button" class="nav-link-btn" (click)="onSelectGenero('Hombre')">Hombre</button>
      <button type="button" class="nav-link-btn" (click)="onSelectGenero('Mujer')">Mujer</button>
      <button type="button" class="nav-link-btn" (click)="onSelectGenero('Unisex')">Unisex</button>
      <a href="/seguimiento" class="nav-link-btn"><i class="bi bi-geo-alt me-1 text-primary"></i>Rastrear</a>
      <a href="/reclamaciones" class="nav-link-btn"><i class="bi bi-book me-1 text-muted"></i>Reclamaciones</a>
      <a href="/monitoreo" class="nav-link-btn text-muted"><i class="bi bi-activity me-1 text-success"></i>Servidor</a>
    </nav>

    <!-- Única Acción Derecha: Botón de Bolsa de Compras -->
    <div class="d-flex align-items-center">
      <button type="button" class="btn btn-sm btn-brand d-inline-flex align-items-center gap-2 position-relative px-3 py-2" (click)="onToggleBolsa()" title="Abrir Bolsa de Compras">
        <i class="bi bi-bag-fill"></i>
        <span>Bolsa</span>
        @if (cartService.totalItems() > 0) {
          <span class="badge bg-danger rounded-pill cart-badge-num">{{ cartService.totalItems() }}</span>
        }
      </button>
    </div>
  </div>
</header>
