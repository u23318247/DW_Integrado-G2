# ===================================================================
# Laboratorio 09 - Spring Security: JWT (API REST Stateless)
# Configuracion principal: MySQL 8.x
# ===================================================================

spring.application.name=tienda-seguridad

# Puerto de la API REST
server.port=8080

# ------------------------------------------------------------------
# Fuente de datos MySQL 8.x (base de datos conservada de la semana 8)
# ------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update crea o actualiza las tablas roles, usuarios,
# usuarios_roles, productos y movimientos_stock.
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------
# Tarea 2: Propiedades y clave criptografica JWT
#
# La clave debe ser un string Base64 de AL MENOS 32 bytes (256 bits)
# para HMAC-SHA256. Se suministra por variable de entorno para no
# versionar el secreto en el repositorio.
#
# Como generarla (PowerShell):
#   $b = New-Object byte[] 48
#   [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b)
#   [Convert]::ToBase64String($b)
#
# Como arrancarla con la clave:
#   $env:JWT_SECRET_BASE64="<pegar aqui la clave>"
#   mvn spring-boot:run
# ------------------------------------------------------------------
app.jwt.issuer=tienda-api
app.jwt.ttl-minutes=30
app.jwt.secret-base64=${JWT_SECRET_BASE64}

# ------------------------------------------------------------------
# Datos semilla de seguridad (conservados de la semana 8)
# usuario / Usuario123*  -> ROLE_USER
# admin   / Admin123*    -> ROLE_ADMIN, ROLE_USER
# ------------------------------------------------------------------
app.datos-seguridad.iniciales=true

# ------------------------------------------------------------------
# Logging de seguridad util para depurar la validacion del token
# ------------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO