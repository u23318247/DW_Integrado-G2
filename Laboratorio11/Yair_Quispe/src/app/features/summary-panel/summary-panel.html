<section class="summary-panel" aria-label="Métricas del Catálogo">
  <div class="summary-card total">
    <div class="summary-card__icon">📦</div>
    <div class="summary-card__info">
      <span class="label">Total Productos</span>
      <strong class="value">{{ totalProductos }}</strong>
    </div>
  </div>

  <div class="summary-card available">
    <div class="summary-card__icon">✅</div>
    <div class="summary-card__info">
      <span class="label">Disponibles</span>
      <strong class="value">{{ totalDisponibles }}</strong>
    </div>
  </div>

  <div class="summary-card out">
    <div class="summary-card__icon">⚠️</div>
    <div class="summary-card__info">
      <span class="label">Sin Stock (Agotados)</span>
      <strong class="value">{{ totalSinStock }}</strong>
    </div>
  </div>
</section>
