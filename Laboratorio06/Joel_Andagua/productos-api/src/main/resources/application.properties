spring.application.name=productos-api

# Conexión a SQL Server (puerto por defecto 1433)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=productos_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración de Hibernate (Crea o actualiza la tabla 'productos' automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true