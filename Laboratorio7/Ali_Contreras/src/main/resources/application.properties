spring.application.name=tienda

# --- Conexion a MySQL ---
# createDatabaseIfNotExist crea tienda_db automaticamente si aun no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Seguridad: en un proyecto real esta contrasena iria en una variable de entorno,
# nunca versionada. Para el laboratorio local se deja aqui.
spring.datasource.password=root

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
