spring.application.name=productos-api

# --- Conexion a MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/productos_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Seguridad: en un proyecto real esta contrasena iria en una variable de entorno,
# nunca versionada. Para el laboratorio local se deja aqui.
spring.datasource.password=root

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
